[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
# Narrator Voice, extracted from voice-cloning on 2026-09-16 under
# docs/decisions/0013-narrator-voice-moves-to-its-own-repository.md.
# The import package keeps its historical name, heritage_archive (ADR-0013 decision 7).
name = "narrator-voice"
version = "0.0.0"
description = "Local single-operator narration studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
narrator = [
    "httpx==0.28.1",
    "defusedxml==0.7.1",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"heritage_archive.contexts.narrator_voice.infrastructure.loopback_web" = ["assets/*.css", "assets/*.js"]
